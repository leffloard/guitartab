[project]
name = "barrefree-analyzer"
version = "0.0.0"
description = "Audio analysis service for BarreFree: beats, key and timed chord labels (raw analysis only, no music-theory transforms)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beat-this>=1.1.0",
    "demucs>=4.1.0",
    "fastapi>=0.135",
    "librosa>=0.11",
    "mir-eval>=0.8",
    "numpy>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "torch>=2.9",
    "torchaudio>=2.9",
    "uvicorn[standard]>=0.35",
    "vamp>=1.1.0",
]

[project.scripts]
barrefree-export-schema = "barrefree_analyzer.export_schema:main"
barrefree-worker = "barrefree_analyzer.worker:main"
barrefree-download-models = "barrefree_analyzer.models:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "jsonschema>=4.25",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
    "types-jsonschema>=4.25",
]

# torch must come from the CPU wheel index: from PyPI, Linux would also pull the CUDA libraries
# (several GB).
[tool.uv]
# Platforms the lock file resolves for. Intel macOS is left out: current torch has no wheels for
# it, and demucs pins numpy < 2 there, which conflicts with librosa 1.0.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv.extra-build-dependencies]
# vamp ships only an sdist; its C extension compiles against NumPy, which must match the
# runtime version.
vamp = ["setuptools", { requirement = "numpy", match-runtime = true }]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barrefree_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Untyped third-party packages.
module = ["mir_eval.*", "mir_eval", "soundfile", "vamp", "vampyhost", "beat_this.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
