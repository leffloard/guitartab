[project]
name = "barrefree-analyzer"
version = "0.0.0"
description = "Audio analysis service for BarreFree: beats, key and timed chord labels (raw analysis only, no music-theory transforms)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
barrefree-export-schema = "barrefree_analyzer.export_schema:main"
barrefree-worker = "barrefree_analyzer.worker:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "jsonschema>=4.25",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
    "types-jsonschema>=4.25",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barrefree_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
